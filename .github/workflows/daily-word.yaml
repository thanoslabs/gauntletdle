name: Import Daily Puzzles

on:
  schedule:
    # 05:17 UTC is after midnight in New York in both EDT and EST.
    # GitHub may delay scheduled runs; do not gate execution on the local hour.
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Puzzle date (YYYY-MM-DD); blank uses today's Eastern date"
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-puzzle-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Eastern puzzle date
        id: clock
        run: echo "date=$(TZ=America/New_York date +%F)" >> "$GITHUB_OUTPUT"
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import puzzle
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          TODAY: ${{ steps.clock.outputs.date }}
        run: |
          python3 scripts/import_daily_word.py --date "${REQUESTED_DATE:-$TODAY}"
      - name: Import Krillion reveal
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          TODAY: ${{ steps.clock.outputs.date }}
        run: |
          python3 scripts/import_daily_krillion.py --date "${REQUESTED_DATE:-$TODAY}"
      - name: Commit puzzles to main
        id: publish
        env:
          REQUESTED_DATE: ${{ inputs.date }}
          TODAY: ${{ steps.clock.outputs.date }}
        run: |
          set -euo pipefail
          date="${REQUESTED_DATE:-$TODAY}"
          wordle="games/wordle/daily/$date.json"
          krillion="games/krillion/daily/$date.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$wordle" "$krillion"
          if git diff --cached --quiet; then
            echo "Both daily puzzles already committed; nothing to publish"
            exit 0
          fi
          git commit -m "data: import daily puzzles $date"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy updated daily puzzle
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run docs.yaml --ref main
